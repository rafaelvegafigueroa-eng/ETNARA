<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Prototipo — Plataforma de Cuidado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
:root{
  --bg:#fffbf5; --surface:#ffffff; --surface-muted:#f6efe4; --border:#e8ddc9;
  --ink:#17324a; --ink-soft:#2c4d6b; --ink-tint:#e4ecf1;
  --verified:#3d7a54; --verified-bg:#e6f0e8;
  --warning:#b5651d; --warning-bg:#f7ead9;
  --critical:#ab3327; --critical-bg:#f8e4e1;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  --tap:48px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;}
button{font-family:var(--font-body);cursor:pointer;}
#root{min-height:100dvh;}
::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

/* ================= ICONS ================= */
function Icon({ path, size=20, color='currentColor', sw=2 }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"><path d={path}/></svg>;
}
const I = {
  shield:"M12 2 4 5v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V5l-8-3z",
  check:"M20 6 9 17l-5-5",
  pin:"M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z M12 13a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z",
  meal:"M18 2v6a2 2 0 0 1-2 2h-1v10 M15 10V2 M12 2v20 M6 2v20 M6 12H2",
  hydration:"M12 2s6 7 6 12a6 6 0 0 1-12 0c0-5 6-12 6-12z",
  activity:"M22 12h-4l-3 9L9 3l-3 9H2",
  mood:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M8 14s1.5 2 4 2 4-2 4-2 M9 9h.01 M15 9h.01",
  camera:"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
  bath:"M9 6 6.5 3.5a1.5 1.5 0 0 0-2.6 1L4 6 M4 12h16 M4 12v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6",
  note:"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M9 13h6 M9 17h6",
  alert:"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01",
  chevron:"m9 18 6-6-6-6",
  back:"M19 12H5 M12 19l-7-7 7-7",
  home:"M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z",
  history:"M3 3v5h5 M3.05 13A9 9 0 1 0 6 5.3L3 8 M12 7v5l4 2",
  message:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
  users:"M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75",
};

/* ================= DEMO DATA ================= */
const RESIDENTS = [
  { id:"carmen", name:"Carmen Rivera Demo", age:82, room:"Habitación 104", initials:"CR", color:"#e7cf9f", status:"active_care", caregiverId:"maria", lastUpdate:"2:14 PM" },
  { id:"jose", name:"José Méndez Demo", age:79, room:"Habitación 108", initials:"JM", color:"#bcd4c7", status:"shift_completed", lastUpdate:"1:40 PM" },
  { id:"elena", name:"Elena Cruz Demo", age:85, room:"Habitación 112", initials:"EC", color:"#e3c2b8", status:"upcoming", statusDetail:"3:00 PM", lastUpdate:"11:05 AM" },
];
const CAREGIVERS = {
  maria: { id:"maria", name:"María López Demo", role:"Cuidadora Certificada", initials:"ML", color:"#cfe0d6", verified:true, years:7, langs:["Español","Inglés"],
    bio:"María se especializa en el cuidado de adultos mayores con movilidad reducida. Le apasiona crear rutinas que combinan bienestar físico y compañía genuina.",
    lastReview:"Julio 2026",
    credentials:[
      {label:"Identidad verificada",status:"ok"},{label:"Background Check revisado",status:"ok"},
      {label:"Ley 300 vigente",status:"ok"},{label:"CPR vigente",status:"ok"},
      {label:"BLS vigente",status:"ok"},{label:"Capacitación interna completada",status:"ok"},
    ]},
  pedro: { id:"pedro", name:"Pedro Santos Demo", role:"Cuidador", initials:"PS", color:"#e0d3c2", verified:false, years:2, langs:["Español"],
    bio:"Pedro está completando su proceso de verificación antes de recibir asignaciones activas.", lastReview:"Pendiente",
    credentials:[
      {label:"Identidad verificada",status:"ok"},{label:"Background Check revisado",status:"action"},
      {label:"Ley 300 vigente",status:"action"},{label:"CPR vigente",status:"ok"},
      {label:"BLS vigente",status:"action"},{label:"Capacitación interna completada",status:"action"},
    ]},
  laura: { id:"laura", name:"Laura Méndez Demo", role:"Enfermera Práctica", initials:"LM", color:"#d9cbe0", verified:true, years:11, langs:["Español","Inglés","Portugués"],
    bio:"Laura aporta experiencia clínica al equipo, con enfoque en pacientes con condiciones crónicas.", lastReview:"Junio 2026",
    credentials:[
      {label:"Identidad verificada",status:"ok"},{label:"Background Check revisado",status:"ok"},
      {label:"Ley 300 vigente",status:"ok"},{label:"CPR vigente",status:"expiring",detail:"Vence en 12 días"},
      {label:"BLS vigente",status:"ok"},{label:"Capacitación interna completada",status:"ok"},
    ]},

const FAMILY = { name:"Ana Rivera Demo", relationship:"Hija", canViewPhotos:true, canReceiveNotifications:true };
const TIMELINE_TODAY = [
  { type:"pin", time:"8:02 AM", title:"Check-in", detail:"María llegó y comenzó el turno.", worker:"María López Demo" },
  { type:"meal", time:"8:45 AM", title:"Desayuno", detail:"Consumió casi todo." },
  { type:"hydration", time:"9:20 AM", title:"Hidratación", detail:"Tomó agua." },
  { type:"activity", time:"10:15 AM", title:"Actividad", detail:"Caminata de 15 minutos." },
  { type:"mood", time:"11:30 AM", title:"Estado de ánimo", detail:"Animada y conversadora." },
  { type:"meal", time:"12:30 PM", title:"Almuerzo", detail:"Consumió aproximadamente 75%." },
  { type:"camera", time:"2:00 PM", title:"Actividad con fotografía", detail:"Tarde de dominó en el jardín.", photo:true },
  { type:"check", time:"4:55 PM", title:"Check-out", detail:"Turno completado.", worker:"María López Demo" },
];

/* ================= PRIMITIVES ================= */
function Badge({tone,children,icon,size}) {
  const map = { verified:["var(--verified-bg)","var(--verified)"], warning:["var(--warning-bg)","var(--warning)"],
    critical:["var(--critical-bg)","var(--critical)"], neutral:["var(--surface-muted)","var(--ink-soft)"], active:["var(--ink-tint)","var(--ink)"] };
  const [bg,fg] = map[tone];
  return <span style={{display:"inline-flex",alignItems:"center",gap:6,background:bg,color:fg,borderRadius:999,
    padding:size==="sm"?"4px 10px":"6px 14px",fontSize:size==="sm"?12:14,fontWeight:600,whiteSpace:"nowrap"}}>{icon}{children}</span>;
}
function Card({children,onClick,style}) {
  return <div onClick={onClick} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:16,
    boxShadow:"0 1px 3px rgba(23,50,74,.06)",padding:16,cursor:onClick?"pointer":"default",...style}}>{children}</div>;
}
function Avatar({initials,color,size=56}) {
  return <div style={{width:size,height:size,borderRadius:"50%",background:color,display:"flex",alignItems:"center",justifyContent:"center",
    fontFamily:"var(--font-display)",fontWeight:600,fontSize:size/2.6,flexShrink:0}}>{initials}</div>;
}
function Header({title,subtitle,onBack}) {
  return <div style={{display:"flex",alignItems:"center",gap:12,padding:"20px 20px 12px"}}>
    {onBack && <button onClick={onBack} aria-label="Volver" style={{width:"var(--tap)",height:"var(--tap)",border:"none",background:"transparent",borderRadius:999,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon path={I.back}/></button>}
    <div><h1 style={{fontSize:22}}>{title}</h1>{subtitle && <p style={{margin:0,color:"var(--ink-soft)",fontSize:13}}>{subtitle}</p>}</div>
  </div>;
}
function PrimaryButton({children,onClick,disabled,critical}) {
  return <button onClick={onClick} disabled={disabled} style={{width:"100%",minHeight:"var(--tap)",borderRadius:16,border:"none",
    background:disabled?"var(--border)":critical?"var(--critical)":"var(--ink)",color:disabled?"var(--ink-soft)":"white",
    fontSize:17,fontWeight:600,padding:"0 20px"}}>{children}</button>;
}

/* ================= TIMELINE ================= */
function Timeline({events, onExpand}) {
  const [open,setOpen] = useState(null);
  return <div style={{position:"relative",paddingLeft:28}}>
    <div style={{position:"absolute",left:13,top:8,bottom:8,width:2,background:"var(--border)"}}/>
    {events.map((e,idx)=>{
      const expanded = open===idx;
      return <div key={idx} style={{position:"relative",marginBottom:20}}>
        <div style={{position:"absolute",left:-28,top:2,width:26,height:26,borderRadius:"50%",background:"var(--surface)",border:"2px solid var(--ink)",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <Icon path={I[e.type]} size={13}/>
        </div>
        <button onClick={()=>setOpen(expanded?null:idx)} style={{width:"100%",textAlign:"left",background:"none",border:"none",padding:0}}>
          <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:2}}>
            <span style={{fontFamily:"var(--font-mono)",fontSize:13,color:"var(--ink-soft)"}}>{e.time}</span>
            <span style={{fontWeight:600}}>{e.title}</span>
          </div>
          <p style={{margin:0,color:"var(--ink-soft)"}}>{e.detail}</p>
          {expanded && e.worker && <p style={{margin:"6px 0 0",fontSize:12,color:"var(--ink-soft)"}}>Registrado por {e.worker}</p>}
          {e.photo && <div style={{marginTop:8,height:110,borderRadius:10,background:"var(--surface-muted)",display:"flex",alignItems:"center",justifyContent:"center",gap:6,color:"var(--ink-soft)",fontSize:13}}><Icon path={I.camera} size={16}/>Foto compartida (demo)</div>}
        </button>
      </div>;
    })}
  </div>;
}

/* ================= FAMILY SCREENS ================= */
function FamilyToday({go}) {
  const resident = RESIDENTS[0];
  const caregiver = CAREGIVERS[resident.caregiverId];
  return <div style={{paddingBottom:32}}>
    <div style={{padding:"20px 20px 16px",display:"flex",alignItems:"center",gap:12}}>
      <Avatar initials={resident.initials} color={resident.color} size={52}/>
      <div><h1 style={{fontSize:22}}>{resident.name.split(" ")[0]} está bien</h1>
      <p style={{margin:0,fontSize:13,color:"var(--ink-soft)"}}>Última actualización: {resident.lastUpdate}</p></div>
    </div>
    <div style={{padding:"0 20px"}}>
      <Card style={{marginBottom:24}}>
        <p style={{margin:"0 0 8px",fontSize:12,fontWeight:700,letterSpacing:.4,textTransform:"uppercase",color:"var(--verified)"}}>Cuidado activo</p>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <Avatar initials={caregiver.initials} color={caregiver.color} size={48}/>
          <div style={{flex:1}}><p style={{margin:0,fontWeight:600}}>{caregiver.name}</p>
            <Badge tone="verified" size="sm" icon={<Icon path={I.shield} size={12}/>}>Profesional Verificada</Badge></div>
        </div>
        <p style={{margin:"12px 0 12px",fontSize:12,color:"var(--ink-soft)"}}>Horario: 8:00 AM – 5:00 PM</p>
        <button onClick={()=>go("family_caregiver",{id:caregiver.id})} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",fontWeight:600,fontSize:12,padding:0}}>
          Ver perfil <Icon path={I.chevron} size={14}/></button>
      </Card>
      <h2 style={{fontSize:18,marginBottom:16}}>Hoy</h2>
      <Timeline events={TIMELINE_TODAY}/>
    </div>

}
function FamilyHistory() {
  const days=[["Hoy","8 actualizaciones · turno completado"],["Ayer","7 actualizaciones · turno completado"],["Lunes 11 de agosto","6 actualizaciones · turno completado"]];
  return <div><Header title="Historial" subtitle="Días anteriores de Carmen"/>

    </div></div>;
}
function FamilyMessages() {
  return <div><Header title="Mensajes" subtitle="Con el equipo de Hogar Serenidad Demo"/>
    <div style={{padding:"0 20px"}}>
      <Card style={{background:"var(--warning-bg)",border:"none",marginBottom:16}}><p style={{margin:0,fontSize:12,color:"var(--warning)"}}>Para emergencias, llama directamente al (787) 555-0100.</p></Card>
      <Card><p style={{margin:0,fontSize:12,color:"var(--ink-soft)"}}>Aún no has enviado mensajes. Escribe aquí si tienes alguna pregunta para el equipo de cuidado. (Demo — sin envío real)</p></Card>

      <Card><p style={{margin:"0 0 8px",fontWeight:600,fontSize:12}}>Notificaciones</p><p style={{margin:0,fontSize:12,color:"var(--ink-soft)"}}>{FAMILY.canReceiveNotifications?"Activadas":"Desactivadas"}</p></Card>

function FamilyTrust({go}) {
  const caregiver = CAREGIVERS.maria;
  return <div><Header title="Centro de Confianza"/>
    <div style={{padding:"0 20px"}}>
      <Card onClick={()=>go("family_caregiver",{id:caregiver.id})} style={{textAlign:"center",marginBottom:20}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:12}}><Avatar initials={caregiver.initials} color={caregiver.color} size={64}/></div>
        <p style={{margin:0,fontWeight:600,fontSize:18}}>{caregiver.name}</p>
        <p style={{margin:"2px 0 12px",fontSize:12,color:"var(--ink-soft)"}}>Cuidadora</p>
        <Badge tone="verified" icon={<Icon path={I.shield} size={16}/>}>Profesional Verificada</Badge>
        <p style={{margin:"12px 0 0",fontSize:12,color:"var(--ink-soft)"}}>Verificación revisada por la plataforma</p>
      </Card>
      <p style={{fontWeight:600,fontSize:12,marginBottom:8}}>Requisitos verificados</p>
      <Card style={{marginBottom:16}}>
        {caregiver.credentials.map((c,i)=><div key={c.label} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderTop:i>0?"1px solid var(--border)":"none"}}>
          <Icon path={I.check} size={16} color="var(--verified)"/><span>{c.label}</span></div>)}
      </Card>
      <p style={{fontSize:12,color:"var(--ink-soft)",marginBottom:16}}>Última revisión: {caregiver.lastReview}. La familia ve el estado resumido de cumplimiento — no se muestran documentos ni información privada.</p>
      <button onClick={()=>go("family_caregiver",{id:caregiver.id})} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",fontWeight:600,padding:0}}>

      <p style={{fontWeight:600,fontSize:12,marginBottom:8}}>Estado de requisitos</p>
      <Card>{c.credentials.map((cr,i)=><div key={cr.label} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0",borderTop:i>0?"1px solid var(--border)":"none"}}>

/* ================= CAREGIVER SCREENS ================= */
function CaregiverMyShift({shift,go}) {

  return <div><Header title="Mi turno de hoy"/>

        {shift.stage==="active" && <><Badge tone="active">Turno en curso</Badge><div style={{marginTop:12}}><PrimaryButton onClick={()=>go("caregiver_active")}>Ir al turno activo</PrimaryButton></div></>}
        {shift.stage==="completed" && <Badge tone="verified">Turno completado</Badge>}

/* Verificación de identidad compartida por check-in y check-out -- mismo
   componente, dos modos, porque ambos son verification_events del mismo
   tipo en el backend (check_in / check_out), solo cambia la copia y el
   destino al confirmar. */
function CaregiverPinVerification({mode,onConfirm,go}) {
  const isCheckout = mode==="checkout";
  const [pin,setPin]=useState(""); const [err,setErr]=useState(false); const [ok,setOk]=useState(false);
  React.useEffect(()=>{
    if(pin.length!==4) return;
    if(pin==="1234"){
      setOk(true); onConfirm();
      const t=setTimeout(()=>go(isCheckout?"caregiver_complete":"caregiver_active"),800);
      return ()=>clearTimeout(t);
    }
    setErr(true); const t=setTimeout(()=>{setPin("");setErr(false);},700); return ()=>clearTimeout(t);
  },[pin]);
  if(ok) return <div style={{padding:"60px 20px",textAlign:"center"}}>
    <p style={{fontFamily:"var(--font-display)",fontSize:22}}>{isCheckout?"Check-out confirmado":"Check-in confirmado"}</p>
    <p style={{color:"var(--ink-soft)"}}>{isCheckout?"Cerrando el turno…":"Llevándote al turno activo…"}</p>
  </div>;
  return <div><Header title={isCheckout?"Verificar salida":"Verificar llegada"} onBack={()=>go(isCheckout?"caregiver_active":"caregiver_home")}/>
    <div style={{padding:"0 20px"}}>
      <p style={{textAlign:"center",marginBottom:20}}>{isCheckout?"Pide el código a la familia para cerrar el turno":"Solicita el código de 4 dígitos a la familia"}</p>
      <div style={{display:"flex",justifyContent:"center",gap:10,marginBottom:20}}>
        {[0,1,2,3].map(i=><div key={i} style={{width:44,height:52,borderRadius:10,border:`2px solid ${err?"var(--critical)":"var(--border)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontFamily:"var(--font-mono)"}}>{pin[i]?"•":""}</div>)}
      </div>
      {err && <p style={{textAlign:"center",color:"var(--critical)",fontSize:12}}>Código incorrecto. Inténtalo de nuevo.</p>}
      <p style={{textAlign:"center",fontSize:11,color:"var(--ink-soft)",marginBottom:16}}>(Demo — usa el código 1234)</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
        {["1","2","3","4","5","6","7","8","9"].map(d=><button key={d} onClick={()=>pin.length<4&&setPin(pin+d)} style={{height:64,borderRadius:16,border:"1px solid var(--border)",background:"var(--surface)",fontSize:24,fontWeight:600}}>{d}</button>)}
        <div/><button onClick={()=>pin.length<4&&setPin(pin+"0")} style={{height:64,borderRadius:16,border:"1px solid var(--border)",background:"var(--surface)",fontSize:24,fontWeight:600}}>0</button>

/* ================= APP ROOT ================= */
function App() {
  const [app,setApp] = useState("family");
  const [screen,setScreen] = useState("family_today");
  const [params,setParams] = useState({});
  const [shift,setShift] = useState({ stage:"not_started", logged:[] });
  const [orgType,setOrgType] = useState("RESIDENTIAL_CARE_HOME");
  const [assignments,setAssignments] = useState({});
  // residentId -> caregiverId. La membresía debe estar 'verified' (elegible)
  // para poder asignarse -- refleja la regla del backend: "la asignación
  // rechaza si eligibility != eligible" (ver backend-architecture-plan.md).

  function go(s,p={}) { setScreen(s); setParams(p); }
  function switchApp(a) {
    setApp(a);
    if(a==="family") go("family_today");
    if(a==="caregiver") go("caregiver_home");
    if(a==="agency") go("agency_home");
  }
  function logEvent(label) { setShift(s=>({...s, logged:[...s.logged, label]})); }
  function confirmCheckIn() { setShift(s=>({...s, stage:"active"})); }
  function finishShift() { setShift(s=>({...s, stage:"completed"})); }
  function resetShift() { setShift({stage:"not_started", logged:[]}); }
  function assignCaregiver(residentId, caregiverId) {
    const caregiver = CAREGIVERS[caregiverId];
    if (!caregiver.verified) return false; // fail-closed, igual que el backend
    setAssignments(a=>({...a,[residentId]:caregiverId}));
    return true;
  }

  let body = null;
  if (app==="family") {
    if (screen==="family_today") body = <FamilyToday go={go}/>;
    else if (screen==="family_history") body = <FamilyHistory/>;
    else if (screen==="family_messages") body = <FamilyMessages/>;
    else if (screen==="family_trust") body = <FamilyTrust go={go}/>;
    else if (screen==="family_profile") body = <FamilyProfile/>;
    else if (screen==="family_caregiver") body = <CaregiverProfile id={params.id} onBack={()=>go("family_trust")}/>;
  } else if (app==="caregiver") {
    if (screen==="caregiver_home") body = <CaregiverMyShift shift={shift} go={go}/>;
    else if (screen==="caregiver_checkin") body = <CaregiverPinVerification mode="checkin" onConfirm={confirmCheckIn} go={go}/>;
    else if (screen==="caregiver_active") body = <CaregiverActive shift={shift} logEvent={logEvent} go={go}/>;
    else if (screen==="caregiver_meal") body = <CaregiverMeal logEvent={logEvent} go={go}/>;
    else if (screen==="caregiver_observation") body = <CaregiverObservation go={go}/>;
    else if (screen==="caregiver_incident") body = <CaregiverIncident go={go}/>;
    else if (screen==="caregiver_checkout") body = <CaregiverPinVerification mode="checkout" onConfirm={finishShift} go={go}/>;
    else if (screen==="caregiver_complete") body = <CaregiverComplete shift={shift} resetShift={resetShift} go={go}/>;
  } else if (app==="agency") {
    if (screen==="agency_home") body = <AgencyDashboard orgType={orgType} setOrgType={setOrgType} go={go} assignments={assignments}/>;
    else if (screen==="agency_resident") body = <AgencyResident id={params.id} go={go} assignments={assignments} assignCaregiver={assignCaregiver}/>;
    else if (screen==="agency_compliance") body = <AgencyCompliance go={go}/>;
    else if (screen==="agency_caregiver") body = <CaregiverProfile id={params.id} onBack={()=>go("agency_compliance")}/>;
  }

  const isMobileApp = app==="family" || app==="caregiver";

  return <div>
    <AppSwitcher app={app} setApp={switchApp}/>
    <div style={{maxWidth: isMobileApp?430:"100%", margin:"0 auto", minHeight:"calc(100dvh - 44px)", display:"flex", flexDirection:"column"}}>
      <div style={{flex:1}}>{body}</div>
      {app==="family" && <FamilyTabBar screen={screen} go={go}/>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
