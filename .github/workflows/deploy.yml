name: Deploy ETNARA Care to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: unzip -q ETNARAfrontendbasepathfixed.zip
        run: |
          rm -rf frontend
          unzip -q Frontend120pm.zip

      - name: Fix Vite base for ETNARA repo
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("vite.config.ts")
          s = p.read_text()

          if re.search(r"\bbase\s*:", s):
              s = re.sub(
                  r"""base\s*:\s*['"][^'"]*['"]""",
                  "base: '/ETNARA/'",
                  s,
                  count=1
              )
          else:
              s = s.replace(
                  "defineConfig({",
                  "defineConfig({\n  base: '/ETNARA/',",
                  1
              )

          p.write_text(s)
          PY
      - name: Fix React Router basename for GitHub Pages
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/App.tsx")
          s = p.read_text()

          if "<BrowserRouter>" in s:
              s = s.replace(
                  "<BrowserRouter>",
                  "<BrowserRouter basename={import.meta.env.BASE_URL}>"
              )

          p.write_text(s)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Add SPA fallback
        working-directory: frontend
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
